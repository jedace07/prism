name: Build Linux Flatpak

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Linux Flatpak (x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # Flatpak's nested build sandboxes need this on the disposable runner.
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source and version
        run: bun run check
      - name: Run unit tests
        run: bun run test
      - name: Prepare Electron application
        run: bun run package
      - name: Verify WebGL previews and browser fallbacks
        timeout-minutes: 5
        env:
          PRISM_SMOKE_EXECUTABLE: ${{ github.workspace }}/dist/Prism-linux-x64/prism
        run: xvfb-run --auto-servernum bun run test:smoke
      - name: Package Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: flatpak/io.github.prismviewer.Prism.json
          bundle: Prism-x86_64.flatpak
          arch: x86_64
          branch: master
          build-dir: .flatpak-build
          repo-dir: .flatpak-repo
          cache: false
          upload-artifact: false
      - name: Verify decoders in the packaged runtime
        run: |
          mkdir -p artifacts
          flatpak build --runtime --readonly --unshare=network .flatpak-build \
            env ELECTRON_RUN_AS_NODE=1 \
            /app/lib/prism/prism /app/lib/prism/resources/app/test/support/verify-package.js \
            > artifacts/flatpak-capabilities.json
      - name: Prepare versioned distribution
        run: bun scripts/prepare-artifacts.ts
      - name: Upload distribution for release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: dist-linux
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: test-evidence-linux
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
