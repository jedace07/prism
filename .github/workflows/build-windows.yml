name: Build Windows portable app

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows portable (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source and version
        run: bun run check
      - name: Run unit tests
        run: bun run test
      - name: Prepare Electron application
        run: bun run package
      - name: Verify the bundled decoder runtime
        run: bun scripts/verify-portable.ts ./dist/Prism-win32-x64/prism.exe
      - name: Verify WebGL previews and browser fallbacks
        timeout-minutes: 5
        env:
          PRISM_SMOKE_EXECUTABLE: ${{ github.workspace }}/dist/Prism-win32-x64/prism.exe
        run: bun run test:smoke
      - name: Archive portable application
        run: Compress-Archive -Path ./dist/Prism-win32-x64 -DestinationPath ./Prism-windows-x64.zip -CompressionLevel Optimal
      - name: Prepare versioned distribution
        run: bun scripts/prepare-artifacts.ts
      - name: Upload distribution for release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: dist-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: test-evidence-windows
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
