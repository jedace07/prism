name: Build Windows installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prepare Electron application
        run: bun run package
      - name: Build offline installation wizard
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run package:windows
      - name: Prepare versioned distribution
        run: bun scripts/prepare-artifacts.ts
      - name: Upload distribution for release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: dist-windows
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
