name: Build Windows installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun from package.json
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source and version
        run: bun run check
      - name: Run unit tests
        run: bun run test
      - name: Prepare Electron application
        run: bun run package
      - name: Build offline installation wizard
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run package:windows
      - name: Install and verify Windows integration
        timeout-minutes: 5
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP 'Prism installer test'
          $installer = Resolve-Path './dist/installer/Prism-windows-x64-setup.exe'
          $process = Start-Process -FilePath $installer -ArgumentList "/S /currentuser /D=$installDirectory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          "PRISM_INSTALL_DIRECTORY=$installDirectory" >> $env:GITHUB_ENV
          $executable = Join-Path $installDirectory 'prism.exe'
          if (!(Test-Path $executable)) { throw 'Installed application is missing' }
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          foreach ($shortcut in @((Join-Path $programs 'Prism.lnk'), (Join-Path $desktop 'Prism.lnk'))) {
            if (!(Test-Path $shortcut)) { throw "Shortcut missing: $shortcut" }
            $shell = New-Object -ComObject WScript.Shell
            if ($shell.CreateShortcut($shortcut).TargetPath -ne $executable) { throw "Incorrect shortcut target: $shortcut" }
          }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Prism' }
          if (!$entry -or $entry.DisplayVersion -ne (Get-Content package.json | ConvertFrom-Json).version) {
            throw 'Windows uninstall registration is missing or has the wrong version'
          }
      - name: Verify the installed decoder runtime
        run: bun scripts/verify-portable.ts "$env:PRISM_INSTALL_DIRECTORY/prism.exe"
      - name: Verify installed WebGL previews and browser fallbacks
        timeout-minutes: 5
        run: |
          $env:PRISM_SMOKE_EXECUTABLE = Join-Path $env:PRISM_INSTALL_DIRECTORY 'prism.exe'
          bun run test:smoke
      - name: Uninstall and verify cleanup
        if: ${{ always() && env.PRISM_INSTALL_DIRECTORY != '' }}
        timeout-minutes: 5
        run: |
          $uninstaller = Join-Path $env:PRISM_INSTALL_DIRECTORY 'Uninstall Prism.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/S /currentuser _?=$env:PRISM_INSTALL_DIRECTORY" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
          if (Test-Path (Join-Path $env:PRISM_INSTALL_DIRECTORY 'prism.exe')) { throw 'Uninstall left the application behind' }
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          foreach ($shortcut in @((Join-Path $programs 'Prism.lnk'), (Join-Path $desktop 'Prism.lnk'))) {
            if (Test-Path $shortcut) { throw "Uninstall left a shortcut: $shortcut" }
          }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Prism' }
          if ($entry) { throw 'Uninstall left its Windows registration behind' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{ installed = $true; shortcuts = $true; registration = $true; uninstalled = $true } |
            ConvertTo-Json | Set-Content artifacts/windows-installer.json
      - name: Prepare versioned distribution
        run: bun scripts/prepare-artifacts.ts
      - name: Upload distribution for release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: dist-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24 LTS
        with:
          name: test-evidence-windows
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
